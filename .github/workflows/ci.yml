name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra all --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  postgres:
    name: Python (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: keel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KEEL_TEST_DATABASE_URL: postgresql+psycopg://keel:keel@127.0.0.1:5432/keel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra all --locked
      - run: uv run pytest -q

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t keel:ci .
      - run: docker run --rm keel:ci --help

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/keel --set secretKey=ci-secret-ci-secret-ci-secret-0123 --set database.url=postgresql+psycopg://k:k@db/k
      - run: helm template keel deploy/helm/keel --set secretKey=x --set postgres.enabled=true --set postgres.password=ci > /dev/null

  action:
    name: GitHub Action (promise check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: ./
        with:
          repo: ${{ github.repository }}
          days: "30"
          badge: promises.svg
      - name: Check the outputs
        run: |
          test -s promises.svg
          echo "kept rate = '${{ steps.check.outputs.kept-rate }}'"
