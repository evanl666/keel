name: Release

# Push a tag like v0.2.0. This publishes:
#   ghcr.io/evanl666/keel:0.2.0, :0.2 and :latest (linux/amd64 + linux/arm64)
#   oci://ghcr.io/evanl666/charts/keel:0.2.0 (the Helm chart)
#   a GitHub release with the Python wheel (UI included) and the Helm chart package
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Version in the code matches the tag
        run: grep -q "^version = \"${{ steps.v.outputs.version }}\"" pyproject.toml
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/keel
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Keel
            org.opencontainers.image.description=One AI steward per team
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the published image
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/keel:${{ steps.v.outputs.version }} --help

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web UI into the package
        working-directory: web
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - uses: azure/setup-helm@v4
      - run: helm package deploy/helm/keel --destination dist
      - name: Push the chart to ghcr.io (helm install oci://ghcr.io/<owner>/charts/keel)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/keel-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
      - name: Release notes from CHANGELOG.md
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          awk -v v="## ${tag#v}" 'index($0, v)==1 {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Keel $tag" --notes-file notes.md
          gh release upload "$tag" dist/* --clobber
