apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keel.fullname" . }}-config
  labels: {{- include "keel.labels" . | nindent 4 }}
data:
  KEEL_BASE_URL: {{ .Values.baseUrl | quote }}
  KEEL_AUTO_MIGRATE: "false"
  {{- range $k, $v := .Values.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
