{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keel.secretName" . }}
  labels: {{- include "keel.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEEL_SECRET_KEY: {{ required "secretKey is required (run: keel secret), or set existingSecret" .Values.secretKey | quote }}
  KEEL_DATABASE_URL: {{ required "database.url is required, or set postgres.enabled" (include "keel.databaseUrl" .) | quote }}
  {{- range $k, $v := .Values.extraSecretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
