apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keel.fullname" . }}-worker
  labels: {{- include "keel.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "keel.selector" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels: {{- include "keel.selector" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.metrics.annotations .Values.worker.metricsPort }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.worker.metricsPort | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      # Kubernetes adds KEEL_PORT=tcp://... for a Service named keel; that clashes with Keel's KEEL_ settings.
      enableServiceLinks: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Workers claim jobs with FOR UPDATE SKIP LOCKED, so any number can run side by side.
      # Schema upgrade before start. Postgres advisory lock: one replica migrates, the rest wait, then no-op.
      initContainers:
        - name: migrate
          image: {{ include "keel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          {{- include "keel.podEnv" . | nindent 10 }}
      containers:
        - name: worker
          image: {{ include "keel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          {{- include "keel.podEnv" . | nindent 10 }}
          env:
            - {name: KEEL_WORKER_METRICS_PORT, value: {{ .Values.worker.metricsPort | quote }}}
          {{- if .Values.worker.metricsPort }}
          ports:
            - {name: metrics, containerPort: {{ .Values.worker.metricsPort }}}
          {{- end }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- include "keel.podVolumes" . | nindent 6 }}
