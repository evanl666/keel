# Single-server install: Postgres + Keel (web and worker in one container).
#   cp deploy/.env.example deploy/.env   # then set KEEL_SECRET_KEY (keel secret) and POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml up -d
#   open http://localhost:8420  → the setup wizard
name: keel

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keel
      POSTGRES_DB: keel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel -d keel"]
      interval: 5s
      timeout: 3s
      retries: 20

  keel:
    image: ${KEEL_IMAGE:-ghcr.io/evanl666/keel:latest}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      KEEL_DATABASE_URL: postgresql+psycopg://keel:${POSTGRES_PASSWORD}@db:5432/keel
      KEEL_BASE_URL: ${KEEL_BASE_URL:-http://localhost:8420}
    ports:
      - "${KEEL_PORT:-8420}:8420"

volumes:
  pgdata:
